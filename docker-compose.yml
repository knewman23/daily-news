# The local web app, startable and stoppable on demand:
#
#   docker compose up -d --build     # first time, or after changing the Dockerfile
#   docker compose stop              # stop, keep the container
#   docker compose start             # start it again
#   docker compose logs -f           # the request log
#   docker compose down              # remove the container
#
# The pipeline is not in here. run_daily.py fetches from Instagram and uses
# macOS Vision and Whisper, so it stays on the host.

services:
  web:
    build: .
    image: daily-news-web
    container_name: daily-news-web

    # The whole project, read-write: news/ is the app's data and its notes are
    # saved back to it, config/sources.json is written by the UI, and site/ is
    # regenerated by a publish. Keeping it a mount rather than a copy is also
    # what stops the journal from ending up inside an image.
    volumes:
      - .:/app

    # Loopback on the host side. config.toml's [serve] host is overridden to
    # 0.0.0.0 by the command in the Dockerfile — that binds inside the container
    # only, and this mapping is what actually decides who can reach it.
    #
    # Both numbers are config.toml's [serve] port. Change that and change these.
    ports:
      - "127.0.0.1:8420:8420"

    # So the app comes back after a Docker or machine restart, but a manual
    # `docker compose stop` stays stopped.
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8420/api/days')
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
