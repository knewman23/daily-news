[paths]
news = "news"
raw = "data/raw"
transcripts = "data/transcripts"
logs = "logs"
sources = "config/sources.json"

[fetch]
session_user = "krys.newman"    # session created via: instaloader --load-cookies chrome
backend = "chrome"              # the API path is action-blocked; read posts from a real browser
first_run_lookback_hours = 24   # window used only when a handle has no watermark yet
max_lookback_days = 14          # ceiling on the walk-back, so a stale watermark
                                # can't trigger a crawl of a whole profile history
max_retries = 3
backoff_seconds = 30

[transcribe]
model = "small"            # tiny | base | small | medium | large-v3
compute_type = "int8"
min_words = 10             # transcripts below this are treated as empty

[serve]
host = "127.0.0.1"
port = 8420

[publish]
enabled = true               # export site/ and push it: after a successful run,
                             # and after skipping or restoring a topic by hand
remote = "origin"
branch = "main"
site = "site"

[email]
enabled = true               # email a summary when the run finishes
to = "krys.newman@gmail.com"
sender = "krys.newman@gmail.com"
smtp_host = "smtp.gmail.com"
smtp_port = 587
# The app password lives in the login Keychain, never in this file — this file
# is committed. Store it once with:
#   security add-generic-password -s daily-news-smtp -a krys.newman@gmail.com -w
keychain_service = "daily-news-smtp"
keychain_account = "krys.newman@gmail.com"
site_url = "https://knewman23.github.io/daily-news/"

[retain]
# Days of downloaded video and images to keep. One day is roughly 270 MB and
# compressing it is pointless (mp4 and jpg are already compressed — gzip -9 on a
# real reel came back at 99.3%), so old media is deleted rather than archived.
# Transcripts, caption sidecars, and the digests are kept forever and are enough
# to re-summarize any day offline. Set to a large number to keep everything.
media_days = 3

[interests]
# What counts as news worth keeping. Plain language, not keywords: the summarizer
# judges meaning, so "the war in Iran" also catches a story that never says
# "Iran". Anything the model judges outside `include`, or matching `exclude`, is
# left out of the digest and reported in the log, the run record, and the email —
# so a filter that is too aggressive is visible rather than silent.
include = [
    "politics, government, and elections",
    "the war in Iran and conflict in the Middle East",
    "the Epstein files and related investigations",
    "data centers, their energy and water demand, and AI",
    "immigration and immigration enforcement",
    "courts, indictments, policing, and civil liberties",
    "war, foreign policy, and defence",
    "surveillance and privacy",
    "markets and the economy",
    "climate and the environment",
    "public health policy",
]

exclude = [
    "a creator talking about their own life, family, travel, or hobbies",
    "merch, giveaways, sponsorships, promotions, or asking people to buy or subscribe",
    "personal fitness, training, or race reports",
    "reaction or commentary videos that report nothing new themselves",
    "human interest stories with no policy or political angle",
]
