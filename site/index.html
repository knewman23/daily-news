<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily News · Krys Newman</title>
  <meta name="description" content="A daily digest built from a curated handle list: the day's posts, transcribed off video and deduplicated into one dated archive.">
  <link rel="canonical" href="https://knewman23.github.io/daily-news/">

  <!-- Link previews. og.png is drawn by og.html rather than screenshotted
       from this page, so it does not freeze one morning's date and headline
       into an image that never changes. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Daily News">
  <meta property="og:description" content="The day's posts, transcribed and deduplicated into one dated archive. Every morning at 11:00.">
  <meta property="og:url" content="https://knewman23.github.io/daily-news/">
  <meta property="og:image" content="https://knewman23.github.io/daily-news/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Daily News, with the site's eagle crest.">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The portfolio's mark, inline and byte-identical to the one on
       knewman23.github.io, so the tab looks the same across all three sites. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%230e0f11'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='19' font-weight='700' fill='%23fff' text-anchor='middle'%3Ek%3C/text%3E%3C/svg%3E">

  <!-- Set the theme before first paint. A class swap after load would flash the
       wrong palette on every navigation between here and the portfolio. -->
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    } catch (e) { /* private mode: fall through to the light default */ }
  </script>

  <link rel="preload" href="fonts/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=3c2c3ac17b">
</head>
<!-- data-mode is rewritten to "static" by export_static.py. The read-only build
     drops the journal, the source list, and the run history entirely — not with
     CSS, which would leave a working form for anyone who opens devtools. -->
<body data-mode="static">

<!-- The band is the shared chrome: same markup on knewman23.github.io and on
     ai-frontier, so moving between the three reads as one site. -->
<div class="band">
  <div class="band-inner">
    <span class="crumbs">
      <a href="https://knewman23.github.io/"><b>Krys Newman</b></a>
      <span class="sep">/</span>
      <span class="here">Daily News</span>
    </span>
    <span class="band-tools">
      <button class="theme" id="theme" type="button" aria-live="polite">
        <svg class="i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>
        <span id="theme-text">Dark</span>
      </button>
    </span>
  </div>
</div>

<header class="masthead">
  <div class="masthead-text">
    <h1>Daily News</h1>
    <p class="updated" id="last-updated"></p>
  </div>
  <img class="crest" src="eagle.png?v=632c15edeb" alt="" width="768" height="512">
</header>

<nav class="toolbar" aria-label="Search and browse">
  <div class="toolbar-inner">
    <label class="search">
      <span class="visually-hidden">Search all days</span>
      <input id="search" type="search" placeholder="Search every day…" autocomplete="off">
    </label>

    <button id="active-filter" class="active-filter" hidden></button>

    <!-- Whether the hosted copy is caught up. Live-only: there is nothing to
         publish from the published build, and no server to ask. -->
<button id="menu-button" class="menu-button" type="button"
            aria-expanded="false" aria-controls="drawer" aria-haspopup="true">
      <span class="visually-hidden">Days and filters</span>
      <span aria-hidden="true">⋮</span>
    </button>
  </div>
</nav>

<div class="layout">

<aside id="drawer" class="drawer" aria-label="Days and filters">
  <div class="drawer-head">
    <h2>Browse</h2>
    <button id="drawer-close" class="icon-button" type="button">
      <span class="visually-hidden">Close</span>
      <span aria-hidden="true">✕</span>
    </button>
  </div>

  <section class="panel">
    <h3 class="panel-title">Days</h3>
    <!-- Filled with one <details> per month. A flat list is unusable once the
         archive runs to hundreds of days. -->
    <div id="days" class="days"></div>
  </section>

  <section class="panel">
    <h3 class="panel-title">Topics</h3>
    <div id="tags" class="chips" role="group" aria-label="Filter by topic"></div>
  </section>

</aside>

<main id="main" class="main" aria-live="polite">
  <p class="empty">Loading…</p>
</main>

</div><!-- .layout -->

<!-- ai-frontier's footer.page component, carrying the index's identity links,
     so the three sites close the same way. -->
<div class="crest-wrap">
  <a href="https://knewman23.github.io/" aria-label="Krys Newman, portfolio index">
    <img class="footer-crest" src="eagle.png?v=632c15edeb" alt="" width="768" height="512">
  </a>
</div>

<footer class="page">
  <div class="footer-inner">
    <span>&copy; 2026 Krys Newman</span>
    <span class="links">
      <a href="https://knewman23.github.io/">Portfolio</a>
      <a href="https://github.com/knewman23/daily-news" target="_blank" rel="noopener noreferrer">Source on GitHub</a>
      <a href="https://www.linkedin.com/in/krys-newman/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="mailto:krys.newman@gmail.com">Email</a>
    </span>
  </div>
</footer>

<div id="scrim" class="scrim" hidden></div>

<script src="theme.js?v=197105d2fa"></script>
<script src="app.js?v=5c38b949c7"></script>

<!-- GoatCounter. No cookies and no personal data, so no consent banner.
     ~3.4KB gzipped and loaded async, so it never blocks render. All four
     sites share this origin, so one site code covers them all and the paths
     keep them apart in the dashboard. -->
<script data-goatcounter="https://knewman23.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
