<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily News, link preview card</title>
<!--
  The source for og.png, not a page the site serves.

  It exists because the obvious alternative, screenshotting the real
  masthead, freezes one morning's date and headline into an image that
  then never changes. This is drawn from the same tokens, the same two
  fonts and the same eagle as the site, so it stays on-brand without
  going stale.

  To regenerate:  open at exactly 1200x630 and capture the viewport.
-->
<style>
  @font-face {
    font-family: "Space Grotesk";
    src: url("fonts/space-grotesk-var.woff2") format("woff2-variations");
    font-weight: 300 700; font-style: normal;
  }
  @font-face { font-family:"IBM Plex Mono"; src:url("fonts/plex-mono-400.woff2") format("woff2"); font-weight:400; }
  @font-face { font-family:"IBM Plex Mono"; src:url("fonts/plex-mono-500.woff2") format("woff2"); font-weight:500; }

  :root {
    --bg:      #0b0c0e;
    --ink:     #edeef1;
    --soft:    #9a9da6;
    --faint:   #7b7e88;
    --line:    #22252c;
    --accent:  #8b9bff;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 1200px; height: 630px;
    padding: 88px 80px;
    display: flex; flex-direction: column; justify-content: center;
  }

  /* The eagle bleeds off the right edge so it reads as a watermark behind
     the type rather than a second focal point. It is a thin line drawing,
     so it needs far more opacity than a solid mark would to survive on a
     near-black ground. */
  .crest {
    position: absolute; right: -40px; top: 46%;
    transform: translateY(-50%);
    width: 640px; height: auto;
    /* eagle.png is a black line drawing on transparent. The site inverts it
       under [data-theme="dark"] for exactly this reason; this card is always
       dark, so the invert is unconditional. Without it the bird is black
       lines on a near-black ground and simply is not there. */
    filter: invert(1);
    opacity: .5;
    pointer-events: none;
  }

  .kicker {
    position: relative;
    font-family: var(--mono); font-size: 15px; font-weight: 500;
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 26px;
  }

  h1 {
    position: relative;
    font-size: 116px; line-height: .92; font-weight: 600;
    letter-spacing: -.03em; margin: 0 0 30px;
  }

  .tagline {
    position: relative;
    font-size: 30px; line-height: 1.45; font-weight: 400;
    color: var(--soft); margin: 0; max-width: 24ch;
  }
  .tagline b { color: var(--ink); font-weight: 500; }

  .rule {
    position: relative;
    width: 96px; height: 3px; background: var(--accent);
    margin: 44px 0 0;
  }

  .foot {
    position: absolute; left: 80px; bottom: 56px;
    font-family: var(--mono); font-size: 15px;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--faint); margin: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="crest" src="eagle.png" alt="">
    <p class="kicker">Every morning at 11:00</p>
    <h1>Daily News</h1>
    <p class="tagline">The day's posts, <b>transcribed</b> and <b>deduplicated</b> into one dated archive.</p>
    <div class="rule"></div>
    <p class="foot">knewman23.github.io/daily-news</p>
  </div>
</body>
</html>
